<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Agent</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #07070a;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-muted: rgba(255, 255, 255, 0.4);
            --state-color: 130, 100, 255;    /* indigo default */
            --state-glow: rgba(130, 100, 255, 0.3);
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- FILM GRAIN OVERLAY --- */
        .grain {
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.025;
        }
        .grain svg { width: 100%; height: 100%; }

        /* --- VIGNETTE --- */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, var(--bg) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* --- AMBIENT GLOW --- */
        .ambient-glow {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(var(--state-color), 0.12) 0%, transparent 70%);
            filter: blur(60px);
            pointer-events: none;
            z-index: 1;
            transition: background 1.2s ease;
        }

        /* --- LAYOUT --- */
        .top-section {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 6vh;
            flex-shrink: 0;
        }

        /* --- ORB WRAPPER (float animation) --- */
        .orb-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* --- ORB --- */
        .orb {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 60% 40% 50% 50% / 50% 60% 40% 50%;
            background: radial-gradient(circle at 35% 35%, rgba(var(--state-color), 0.9) 0%, rgba(var(--state-color), 0.3) 60%, transparent 80%);
            box-shadow: 0 0 60px rgba(var(--state-color), 0.4), inset 0 0 30px rgba(255, 255, 255, 0.05);
            transition: background 0.8s ease, box-shadow 0.8s ease;
            z-index: 20;
            animation: morph 8s ease-in-out infinite, breathe 4s ease-in-out infinite;
        }

        /* Multi-layer glow halo */
        .orb::before {
            content: '';
            position: absolute;
            inset: -30px;
            border-radius: inherit;
            background: radial-gradient(circle, rgba(var(--state-color), 0.15) 0%, transparent 70%);
            filter: blur(20px);
            z-index: -1;
            transition: background 0.8s ease;
        }

        @keyframes morph {
            0%   { border-radius: 60% 40% 50% 50% / 50% 60% 40% 50%; }
            25%  { border-radius: 45% 55% 60% 40% / 55% 45% 55% 45%; }
            50%  { border-radius: 50% 50% 40% 60% / 40% 55% 45% 55%; }
            75%  { border-radius: 55% 45% 55% 45% / 60% 40% 50% 50%; }
            100% { border-radius: 60% 40% 50% 50% / 50% 60% 40% 50%; }
        }

        @keyframes breathe {
            0%, 100% { transform: scale(0.97); opacity: 0.85; }
            50% { transform: scale(1.03); opacity: 1; }
        }

        /* State-specific orb styles */
        .orb.listening {
            animation: morph 5s ease-in-out infinite, pulse-listen 1.5s ease-in-out infinite;
        }
        @keyframes pulse-listen {
            0%, 100% { transform: scale(1.0); }
            50% { transform: scale(1.1); }
        }

        .orb.processing {
            animation: morph 6s ease-in-out infinite, shimmer 2s linear infinite;
        }
        @keyframes shimmer {
            0% { filter: hue-rotate(0deg); transform: scale(1.0); }
            50% { filter: hue-rotate(15deg); transform: scale(1.02); }
            100% { filter: hue-rotate(0deg); transform: scale(1.0); }
        }

        .orb.speaking {
            animation: morph 7s ease-in-out infinite, pulse-speak 2s ease-in-out infinite;
        }
        @keyframes pulse-speak {
            0%, 100% { transform: scale(1.0); box-shadow: 0 0 60px rgba(var(--state-color), 0.4); }
            50% { transform: scale(1.06); box-shadow: 0 0 90px rgba(var(--state-color), 0.6); }
        }

        /* --- CANVAS --- */
        canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-weight: 300;
            font-size: 20px;
            color: var(--text-muted);
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        h2 {
            font-weight: 600;
            font-size: 28px;
            background: linear-gradient(135deg, #fff 0%, rgba(var(--state-color), 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: background 1s ease;
        }

        /* --- STATUS --- */
        .status-line {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            height: 20px;
        }

        #status-text {
            font-size: 12px;
            color: rgba(var(--state-color), 0.8);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.8s ease;
        }

        .status-dots {
            display: none;
            gap: 3px;
        }
        .status-dots.active { display: flex; }
        .status-dots span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(var(--state-color), 0.7);
            animation: bounce-dot 1.4s ease-in-out infinite;
        }
        .status-dots span:nth-child(2) { animation-delay: 0.15s; }
        .status-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce-dot {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-5px); opacity: 1; }
        }

        /* --- CHAT CONTAINER --- */
        .chat-section {
            position: relative;
            z-index: 10;
            flex: 1;
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-top: 16px;
            padding: 0 16px;
        }

        .chat-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0 24px;
            mask-image: linear-gradient(to bottom, transparent 0%, black 4%, black 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 4%, black 100%);
            scroll-behavior: smooth;
        }

        /* Custom scrollbar */
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }
        .chat-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        #chat-messages {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- EMPTY STATE --- */
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255, 255, 255, 0.15);
            font-size: 14px;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        /* --- MESSAGE BUBBLES --- */
        .message {
            max-width: 85%;
            opacity: 0;
            transform: translateY(16px);
            animation: slide-in 0.35s ease-out forwards;
        }

        @keyframes slide-in {
            to { opacity: 1; transform: translateY(0); }
        }

        .message.agent { align-self: flex-start; }
        .message.user { align-self: flex-end; }

        .message .speaker {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            padding: 0 4px;
        }
        .message.user .speaker { text-align: right; }

        .message .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.agent .bubble {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 4px 16px 16px 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: rgba(255, 255, 255, 0.85);
        }

        .message.user .bubble {
            background: rgba(var(--state-color), 0.1);
            border: 1px solid rgba(var(--state-color), 0.15);
            border-radius: 16px 4px 16px 16px;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Typing cursor */
        .typing-cursor::after {
            content: '|';
            animation: blink-cursor 0.7s step-end infinite;
            color: rgba(var(--state-color), 0.8);
            font-weight: 300;
            margin-left: 1px;
        }
        @keyframes blink-cursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* --- CONTROLS --- */
        .controls {
            position: relative;
            z-index: 10;
            display: flex;
            gap: 14px;
            align-items: center;
            justify-content: center;
            padding: 16px 0 max(32px, env(safe-area-inset-bottom));
            flex-shrink: 0;
        }

        #btn-talk {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            border-radius: 28px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            color: rgba(255, 255, 255, 0.85);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
            user-select: none;
            -webkit-user-select: none;
        }
        #btn-talk svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: rgba(255, 255, 255, 0.7);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        #btn-talk:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        #btn-talk:active { transform: scale(0.97); }
        #btn-talk:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        #btn-stop {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(255, 80, 80, 0.25);
            background: rgba(255, 50, 50, 0.12);
            color: #ff8888;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.2s ease;
        }
        #btn-stop svg { width: 16px; height: 16px; fill: #ff9999; }
        #btn-stop:hover {
            background: rgba(255, 50, 50, 0.25);
            transform: translateY(-1px);
        }
        #btn-stop:active { transform: scale(0.95); }
    </style>
</head>

<body>
    <!-- Film grain -->
    <div class="grain">
        <svg><filter id="grain-filter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#grain-filter)"/></svg>
    </div>

    <!-- Vignette -->
    <div class="vignette"></div>

    <!-- Ambient glow -->
    <div class="ambient-glow" id="ambient-glow"></div>

    <!-- Top: Orb + Heading + Status -->
    <div class="top-section">
        <div class="orb-wrapper">
            <canvas id="waveCanvas"></canvas>
            <div class="orb" id="orb"></div>
        </div>

        <h1>Hi Andrew</h1>
        <h2>How can I help you?</h2>

        <div class="status-line">
            <span id="status-text"></span>
            <div class="status-dots" id="status-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <!-- Chat -->
    <div class="chat-section">
        <div class="chat-scroll" id="chat-scroll">
            <div id="chat-messages"></div>
            <div class="empty-state" id="empty-state">Your conversation will appear here</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button id="btn-talk" onmousedown="triggerListen()">
            <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 0-4 4v6a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            <span id="btn-talk-label">Push to Talk</span>
        </button>
        <button id="btn-stop" onmousedown="triggerStop()" title="Stop Generation">
            <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" ry="2"></rect></svg>
        </button>
    </div>

    <script>
    // --- API ---
    function triggerListen() { fetch('/api/trigger', { method: 'POST' }).catch(console.error); }
    function triggerStop() { fetch('/api/stop', { method: 'POST' }).catch(console.error); }

    // --- STATE ---
    const STATE = { IDLE: '0', LISTENING: '1', PROCESSING: '2', SPEAKING: '3' };
    let currentState = STATE.IDLE;
    let renderedCount = 0;
    let lastRawTranscript = '';

    // State color map: [r, g, b]
    const stateColors = {
        [STATE.IDLE]:       [130, 100, 255],  // indigo
        [STATE.LISTENING]:  [255, 70, 70],    // red
        [STATE.PROCESSING]: [245, 190, 60],   // amber
        [STATE.SPEAKING]:   [70, 140, 255],   // blue
    };

    const stateLabels = {
        [STATE.IDLE]: '',
        [STATE.LISTENING]: 'Listening',
        [STATE.PROCESSING]: 'Thinking',
        [STATE.SPEAKING]: 'Speaking',
    };

    // --- ELEMENTS ---
    const orb = document.getElementById('orb');
    const ambientGlow = document.getElementById('ambient-glow');
    const statusText = document.getElementById('status-text');
    const statusDots = document.getElementById('status-dots');
    const chatMessages = document.getElementById('chat-messages');
    const chatScroll = document.getElementById('chat-scroll');
    const emptyState = document.getElementById('empty-state');
    const btnTalk = document.getElementById('btn-talk');
    const btnTalkLabel = document.getElementById('btn-talk-label');
    const btnStop = document.getElementById('btn-stop');

    // --- UPDATE STATE VISUALS ---
    function applyState(state) {
        if (state === currentState) return;
        currentState = state;

        const color = stateColors[state] || stateColors[STATE.IDLE];
        const colorStr = color.join(', ');
        document.documentElement.style.setProperty('--state-color', colorStr);
        document.documentElement.style.setProperty('--state-glow', `rgba(${colorStr}, 0.3)`);
        ambientGlow.style.background = `radial-gradient(circle, rgba(${colorStr}, 0.12) 0%, transparent 70%)`;

        // Orb class
        orb.className = 'orb';
        if (state === STATE.LISTENING) orb.classList.add('listening');
        else if (state === STATE.PROCESSING) orb.classList.add('processing');
        else if (state === STATE.SPEAKING) orb.classList.add('speaking');

        // Status text
        statusText.textContent = stateLabels[state] || '';
        statusDots.classList.toggle('active', state !== STATE.IDLE);

        // Buttons
        if (state === STATE.IDLE) {
            btnStop.style.display = 'none';
            btnTalk.disabled = false;
            btnTalkLabel.textContent = 'Push to Talk';
        } else {
            btnStop.style.display = 'flex';
            btnTalkLabel.textContent = 'Interrupt';
        }
    }

    // --- PARSE TRANSCRIPT ---
    function parseMessages(raw) {
        if (!raw || !raw.trim()) return [];
        const blocks = raw.split('\n\n').filter(b => b.trim());
        const messages = [];
        for (const block of blocks) {
            const colonIdx = block.indexOf(':');
            if (colonIdx === -1) continue;
            const role = block.substring(0, colonIdx).trim();
            const content = block.substring(colonIdx + 1).trim();
            // Filter system messages
            if (role.toLowerCase() === 'system') continue;
            messages.push({ role, content });
        }
        return messages;
    }

    // --- RENDER CHAT ---
    function renderChat(raw, isStreaming) {
        const messages = parseMessages(raw);
        if (messages.length === 0) {
            emptyState.style.display = 'flex';
            return;
        }
        emptyState.style.display = 'none';

        // Update existing messages or add new ones
        for (let i = 0; i < messages.length; i++) {
            const msg = messages[i];
            const isAgent = msg.role.toLowerCase() !== 'user';
            const isLast = i === messages.length - 1;
            const showCursor = isStreaming && isLast && isAgent;

            if (i < renderedCount) {
                // Update in-place for streaming (only last message text changes)
                if (isLast) {
                    const el = chatMessages.children[i];
                    if (el) {
                        const bubble = el.querySelector('.bubble');
                        if (bubble) {
                            bubble.textContent = msg.content;
                            bubble.classList.toggle('typing-cursor', showCursor);
                        }
                    }
                }
            } else {
                // Create new message element
                const wrapper = document.createElement('div');
                wrapper.className = 'message ' + (isAgent ? 'agent' : 'user');

                const speaker = document.createElement('div');
                speaker.className = 'speaker';
                speaker.textContent = msg.role;

                const bubble = document.createElement('div');
                bubble.className = 'bubble' + (showCursor ? ' typing-cursor' : '');
                bubble.textContent = msg.content;

                wrapper.appendChild(speaker);
                wrapper.appendChild(bubble);
                chatMessages.appendChild(wrapper);
            }
        }

        // If message count decreased (rare edge case like page refresh), rebuild
        if (messages.length < renderedCount) {
            chatMessages.innerHTML = '';
            renderedCount = 0;
            renderChat(raw, isStreaming);
            return;
        }

        renderedCount = messages.length;

        // Remove typing cursor from non-last agent messages
        const allBubbles = chatMessages.querySelectorAll('.typing-cursor');
        allBubbles.forEach((b, idx) => {
            const msgEl = b.closest('.message');
            if (msgEl !== chatMessages.lastElementChild) {
                b.classList.remove('typing-cursor');
            }
        });

        // Always scroll to bottom so latest content is visible
        chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    // --- CANVAS: WAVES + PARTICLES ---
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');

    const canvasSize = 280;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvasSize * dpr;
    canvas.height = canvasSize * dpr;
    canvas.style.width = `${canvasSize}px`;
    canvas.style.height = `${canvasSize}px`;
    ctx.scale(dpr, dpr);

    let time = 0;
    let targetAmplitude = 5;
    let currentAmplitude = 5;
    let targetColor = stateColors[STATE.IDLE];
    let currentColor = [...targetColor];

    const stateAmplitudes = {
        [STATE.IDLE]: 5,
        [STATE.LISTENING]: 25,
        [STATE.PROCESSING]: 15,
        [STATE.SPEAKING]: 45,
    };

    // Particles
    const PARTICLE_COUNT = 40;
    const particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
            angle: Math.random() * Math.PI * 2,
            radius: 60 + Math.random() * 50,
            speed: 0.002 + Math.random() * 0.004,
            size: 1 + Math.random() * 2,
            opacity: Math.random(),
            fadeSpeed: 0.005 + Math.random() * 0.01,
            fadeDir: 1,
        });
    }

    function lerpColor(a, b, t) {
        return [
            a[0] + (b[0] - a[0]) * t,
            a[1] + (b[1] - a[1]) * t,
            a[2] + (b[2] - a[2]) * t,
        ];
    }

    function drawWave(peaks, speed, phaseOffset, alpha, radiusOffset) {
        const cx = canvasSize / 2;
        const cy = canvasSize / 2;
        const baseR = 70 + radiusOffset;
        const r = Math.round(currentColor[0]);
        const g = Math.round(currentColor[1]);
        const b = Math.round(currentColor[2]);

        ctx.beginPath();
        ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 8;
        ctx.shadowColor = `rgba(${r}, ${g}, ${b}, ${alpha * 0.5})`;

        for (let a = 0; a <= Math.PI * 2; a += 0.02) {
            const noise = Math.sin(a * peaks + time * speed + phaseOffset)
                        * Math.cos(a * (peaks / 2) - time * (speed / 2));
            const rad = baseR + Math.abs(noise) * currentAmplitude;
            const x = cx + rad * Math.cos(a);
            const y = cy + rad * Math.sin(a);
            if (a === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    function drawParticles() {
        const cx = canvasSize / 2;
        const cy = canvasSize / 2;
        const r = Math.round(currentColor[0]);
        const g = Math.round(currentColor[1]);
        const b = Math.round(currentColor[2]);

        for (const p of particles) {
            p.angle += p.speed;
            p.opacity += p.fadeSpeed * p.fadeDir;
            if (p.opacity >= 1) { p.opacity = 1; p.fadeDir = -1; }
            if (p.opacity <= 0) { p.opacity = 0; p.fadeDir = 1; }

            const x = cx + (p.radius + currentAmplitude * 0.3) * Math.cos(p.angle);
            const y = cy + (p.radius + currentAmplitude * 0.3) * Math.sin(p.angle);

            ctx.beginPath();
            ctx.arc(x, y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${p.opacity * 0.5})`;
            ctx.fill();
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        time += 0.025;

        // Smooth interpolation
        currentAmplitude += (targetAmplitude - currentAmplitude) * 0.06;
        currentColor = lerpColor(currentColor, targetColor, 0.04);

        // 4 wave layers
        drawWave(6, 1.5, 0, 0.5, 0);
        drawWave(4, 1.0, 2, 0.35, 5);
        drawWave(3, 0.7, 4, 0.2, 10);
        drawWave(5, 1.2, 6, 0.12, 15);

        // Particles
        drawParticles();

        requestAnimationFrame(animate);
    }
    animate();

    // --- POLLING ---
    let pollInterval = 300;
    let pollTimer = null;

    function poll() {
        fetch('/api/transcript?t=' + Date.now())
            .then(response => {
                const state = response.headers.get('X-Voice-Status') || STATE.IDLE;

                applyState(state);

                // Update canvas targets
                targetAmplitude = stateAmplitudes[state] || 5;
                targetColor = stateColors[state] || stateColors[STATE.IDLE];

                // Adjust poll rate
                const newInterval = (state === STATE.PROCESSING || state === STATE.SPEAKING) ? 150 : 300;
                if (newInterval !== pollInterval) {
                    pollInterval = newInterval;
                    clearInterval(pollTimer);
                    pollTimer = setInterval(poll, pollInterval);
                }

                return response.text();
            })
            .then(text => {
                const isStreaming = currentState === STATE.PROCESSING || currentState === STATE.SPEAKING;
                if (text !== lastRawTranscript || isStreaming) {
                    lastRawTranscript = text;
                    renderChat(text, isStreaming);
                }
            })
            .catch(console.error);
    }

    pollTimer = setInterval(poll, pollInterval);
    poll(); // Initial fetch
    </script>
</body>
</html>
